services:
  - type: web
    name: cafe-fausse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FRONTEND_ORIGINS
        value: https://ajanardh.github.io,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-fausse-db
          property: connectionString

databases:
  - name: cafe-fausse-db
    plan: free
